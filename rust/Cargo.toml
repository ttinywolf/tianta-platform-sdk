[package]
name = "sqliteipc"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
path = "src/lib.rs"

[lints.rust]
non_snake_case = "allow"  # TIANTA API uses the TI_ prefix by design
